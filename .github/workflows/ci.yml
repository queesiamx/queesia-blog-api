name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workdir: ['.', 'api']   # 👈 añade aquí otros subdirectorios si los usas
    steps:
      - run: echo "CI triggered for ${{ github.event_name }} by ${{ github.actor }}"
      - uses: actions/checkout@v4

      # ¿Existe package.json en este directorio?
      - name: Detect package.json
        id: detect
        run: |
          if [ -f "${{ matrix.workdir }}/package.json" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      # Si no hay package.json en el directorio, saltamos el resto
      - name: Skip if no Node project
        if: steps.detect.outputs.present == 'false'
        run: echo "No Node project in ${{ matrix.workdir }}, skipping…"

      # Setup Node solo si hay proyecto
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.workdir }}/package-lock.json

      # Instalar deps (usa npm ci si hay lock; si no, npm install)
      - name: Install deps
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ matrix.workdir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json → using npm install"
            npm install
          fi

      # Build / Test / Lint (se ejecutan solo si existen)
      - name: Build / Test / Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ matrix.workdir }}
        run: |
          npm run build --if-present
          npm test --if-present
          npm run lint --if-present
